<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PCA & Real Pitch Motions</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1419 0%, #162433 50%, #0f1d2a 100%);
            color: #e8eaed;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: #1a273d;
            backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #dba86f;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 10;
            max-height: none;
            overflow-y: visible;
        }

        #ui::-webkit-scrollbar { width: 6px; }
        #ui::-webkit-scrollbar-track { background: transparent; }
        #ui::-webkit-scrollbar-thumb { background-color: #dba86f; border-radius: 3px; }

        .mode-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }

        .mode-btn {
            padding: 9px;
            border: 1.5px solid #465a75;
            background: #1f2f45;
            color: #a0a0a0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            transition: all 0.2s;
        }

        .mode-btn:hover {
            background: #263548;
            border-color: #dba86f;
            color: #e8eaed;
        }

        .mode-btn.active {
            background: #dba86f;
            border-color: #dba86f;
            color: #0f172a;
            font-weight: 700;
        }

        .top-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .frame-display {
            flex: 1;
            background: #1f2f45;
            border: 1px solid #465a75;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #dba86f;
            font-weight: 600;
        }

        .pause-btn {
            width: 45px;
            background: #1f2f45;
            border: 1.5px solid #465a75;
            color: #e8eaed;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .pause-btn:hover {
            background: #263548;
            border-color: #dba86f;
        }

        .pause-btn.paused {
            background: #dba86f;
            border-color: #dba86f;
            color: #0f172a;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px solid #dba86f;
            margin: 12px 0 10px 0;
            padding-bottom: 8px;
        }

        .section-header:first-child {
            margin-top: 0;
        }

        h3 {
            margin: 0;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #e8eaed;
            text-transform: uppercase;
        }

        .reset-link {
            font-size: 8px;
            color: #dba86f;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .reset-link:hover {
            color: #dba86f;
        }

        /* IMPROVED PCA SLIDERS */
        #pca-sliders-container {
            display: grid;
            gap: 6px;
            margin-bottom: 12px;
            padding: 4px;
        }

        #pca-sliders-container::-webkit-scrollbar { width: 5px; }
        #pca-sliders-container::-webkit-scrollbar-thumb { background-color: #465a75; border-radius: 2px; }

        .pca-slider-group {
            display: grid;
            grid-template-columns: 30px 1fr;
            gap: 6px;
            align-items: center;
            padding: 6px;
            background: #1f2f45;
            border-radius: 5px;
            border: 1px solid #2a3f55;
            transition: all 0.15s;
        }

        .pca-slider-group:hover {
            background: #232d45;
            border-color: #465a75;
        }

        .pc-label {
            color: #dba86f;
            font-size: 10px;
            font-weight: 700;
            text-align: center;
            min-width: 30px;
        }

        .slider-wrapper {
            display: grid;
            grid-template-columns: 1fr 40px;
            gap: 4px;
            align-items: center;
        }

        .pca-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 3px;
            background: #465a75;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .pca-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #dba86f;
            cursor: pointer;
            transition: all 0.1s;
        }

        .pca-slider::-webkit-slider-thumb:hover {
            background: #dba86f;
            transform: scale(1.2);
        }

        .pc-value {
            color: #a0a0a0;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            text-align: right;
            min-width: 40px;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            font-size: 9px;
            color: #8a9bab;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        select {
            width: 100%;
            padding: 7px;
            background: #1f2f45;
            border: 1px solid #465a75;
            color: #e8eaed;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        select:hover {
            background: #263548;
            border-color: #dba86f;
        }

        select:focus {
            outline: none;
            background: #263548;
            border-color: #dba86f;
        }

        select option {
            background: #1a273d;
            color: #e8eaed;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }

        .view-btn {
            background: #1f2f45;
            border: 1px solid #465a75;
            color: #a0a0a0;
            padding: 7px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.2s;
        }

        .view-btn:hover {
            background: #263548;
            border-color: #dba86f;
            color: #e8eaed;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            margin-bottom: 6px;
            font-weight: 600;
            color: #8a9bab;
            text-transform: uppercase;
        }

        .value-display {
            color: #dba86f;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            font-weight: 600;
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 3px;
            background: #465a75;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            margin-bottom: 4px;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #dba86f;
            cursor: pointer;
        }

        .range-slider-wrapper {
            position: relative;
            height: 16px;
            margin-top: 6px;
        }

        .dual-input {
            position: absolute;
            width: 100%;
            pointer-events: none;
            -webkit-appearance: none;
            background: none;
            top: 0;
            left: 0;
        }

        .dual-input::-webkit-slider-thumb {
            pointer-events: auto;
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #dba86f;
            cursor: pointer;
        }

        .range-track {
            position: absolute;
            top: 6px;
            width: 100%;
            height: 3px;
            background: #465a75;
            border-radius: 2px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #dba86f;
            background: #1a273d;
            border: 1px solid #dba86f;
            padding: 24px 40px;
            border-radius: 8px;
            pointer-events: none;
            font-weight: 600;
        }

        .hidden {
            display: none !important;
        }

        #pc-weights-display {
            background: #1f2f45;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #2a3f55;
            min-height: 280px;
            font-size: 9px;
        }

        #pc-weights-display::-webkit-scrollbar { width: 5px; }
        #pc-weights-display::-webkit-scrollbar-thumb { background-color: #465a75; border-radius: 2px; }

        .pc-weight-item {
            display: grid;
            grid-template-columns: 35px 1fr;
            gap: 6px;
            align-items: center;
            padding: 4px;
            margin-bottom: 3px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.02);
        }

        .pc-weight-item span:first-child {
            color: #dba86f;
            font-weight: 700;
        }

        .pc-weight-item span:last-child {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            text-align: right;
        }
    </style>
</head>
<body>

<div id="ui">
    <div class="mode-buttons">
        <button class="mode-btn active" id="pca-mode-btn" onclick="setMode('pca')">PCA</button>
        <button class="mode-btn" id="real-mode-btn" onclick="setMode('real')">Real</button>
    </div>

    <div class="top-controls">
        <div class="frame-display">Frame: <span id="frame-counter">0</span></div>
        <button class="pause-btn" id="pause-btn" onclick="togglePause()">▶</button>
    </div>

    <div class="control-group" style="margin-bottom: 12px;">
        <input type="range" id="frame-slider" class="slider" min="0" max="100" value="0" oninput="setFrameFromSlider()" style="margin-bottom: 0;">
    </div>

    <div id="pca-section">
        <div class="section-header">
            <h3>PCA Components</h3>
            <span class="reset-link" onclick="resetPCA()">Reset</span>
        </div>
        <div id="pca-sliders-container"></div>
        
        <div style="margin-top: 8px;">
            <button class="view-btn" id="average-toggle" onclick="toggleAverageMotion()" style="width: 100%; background: #465a75; border-color: #465a75; color: #a0a0a0; font-weight: 600;">Average Motion: OFF</button>
        </div>
        
        <div style="background: #1f2f45; padding: 8px; border-radius: 5px; border: 1px solid #2a3f55; font-size: 8px; margin-top: 8px;">
            <div style="color: #8a9bab; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px;">Legend:</div>
            <div style="display: grid; gap: 4px;">
                <div style="display: flex; align-items: center; gap: 6px;">
                    <div style="width: 8px; height: 8px; border-radius: 50%; background: #67d5ff;"></div>
                    <span style="color: #a0a0a0;">Average Motion</span>
                </div>
                <div style="display: flex; align-items: center; gap: 6px;">
                    <div style="width: 8px; height: 8px; border-radius: 50%; background: #dba86f;"></div>
                    <span style="color: #a0a0a0;">PCA Motion</span>
                </div>
            </div>
        </div>
    </div>

    <div id="real-section" class="hidden">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <div class="section-header" style="margin-top: 0; margin-bottom: 8px;">
                    <h3 style="font-size: 11px;">Pitch Selection</h3>
                </div>
                
                <div class="control-group" style="margin-bottom: 8px;">
                    <label>User</label>
                    <select id="user-select" onchange="updatePitchFilters()">
                        <option value="">All Users</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Pitch</label>
                    <select id="pitch-select" onchange="onPitchSelect()">
                        <option value="">Select a pitch</option>
                    </select>
                </div>

                <div style="display: flex; gap: 6px; margin-bottom: 10px;">
                    <button class="view-btn" id="real-motion-toggle" onclick="toggleRealMotion()" style="flex: 1; background: #67d5ff; border-color: #67d5ff; color: #0a1419; font-weight: 700;">Real Motion: ON</button>
                </div>

                <div style="display: flex; gap: 6px; margin-bottom: 10px;">
                    <button class="view-btn" id="reconstruction-toggle" onclick="toggleReconstruction()" style="flex: 1; background: #465a75; border-color: #465a75; color: #a0a0a0; font-weight: 600;">Reconstruction: OFF</button>
                </div>

                <div style="background: #1f2f45; padding: 8px; border-radius: 5px; border: 1px solid #2a3f55; font-size: 8px;">
                    <div style="color: #8a9bab; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px;">Legend:</div>
                    <div style="display: grid; gap: 4px;">
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <div style="width: 8px; height: 8px; border-radius: 50%; background: #67d5ff;"></div>
                            <span style="color: #a0a0a0;">Real Motion</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <div style="width: 8px; height: 8px; border-radius: 50%; background: #dba86f;"></div>
                            <span style="color: #a0a0a0;">PCA Reconstruction</span>
                        </div>
                    </div>
                </div>
            </div>
            <div id="pc-weights-display">
                <div style="color: #8a9bab; text-align: center; padding: 30px 0; font-size: 9px;">Select a pitch to view PC weights</div>
            </div>
        </div>
    </div>

    <div id="camera-section">
        <div class="section-header">
            <h3>Camera</h3>
        </div>
        <div class="button-row">
            <button class="view-btn" onclick="setView('front')">Front</button>
            <button class="view-btn" onclick="setView('side')">Side</button>
            <button class="view-btn" onclick="setView('back')">Back</button>
            <button class="view-btn" onclick="setView('perspective')">3D</button>
        </div>
    </div>

    <div id="playback-section">
        <div class="section-header">
            <h3>Playback</h3>
        </div>
        <div class="control-group">
            <div class="label-row">
                <span>FPS</span>
                <span id="fps-display" class="value-display">60</span>
            </div>
            <input type="range" id="fps-slider" class="slider" min="1" max="120" value="60" onchange="updateFPS()">
        </div>

        <div class="control-group" id="frame-range-control">
            <div class="label-row">
                <span>Frame Range</span>
                <span id="range-display" class="value-display">0 - 100</span>
            </div>
            <div class="range-slider-wrapper">
                <div class="range-track"></div>
                <input type="range" id="range-start" class="dual-input" min="0" max="100" value="0" onchange="updateRange()">
                <input type="range" id="range-end" class="dual-input" min="0" max="100" value="100" onchange="updateRange()">
            </div>
        </div>
    </div>
</div>

<div id="loading">Loading Data...</div>

<script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158/+esm';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.158/examples/jsm/controls/OrbitControls.js/+esm';

    let mode = 'pca';
    let PCA = null, REAL_DATA = null, MARKER_MAPPING = null;
    let sigmas = [], fps = 60, lastFrameTime = 0, frame = 0, frameStart = 0, frameEnd = 100;
    let isPaused = false;
    let meanMotion = null;
    const markerMeshes = [], skeletonLines = [];
    const meanMarkerMeshes = [], meanSkeletonLines = [];
    let featureMap = [];
    let currentRealPitch = null;
    let PCA_SCORES = null;
    let showReconstruction = false;
    let showAverageMotion = false;
    let showRealMotion = true;
    
    // Material references - will be set in init
    let pcaMotionMat, averageMotionMat, realMotionMat, reconstructionMat;
    let pcaMotionLineMat, averageMotionLineMat, realMotionLineMat, reconstructionLineMat;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1419);
    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 100);
    camera.position.set(3.5, 2.04, 3.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; 
    controls.dampingFactor = 0.1;
    controls.target.set(0, 0.9, 0);
    controls.maxPolarAngle = Math.PI / 1.6;
    controls.minDistance = 1;
    controls.maxDistance = 10;

    window.setView = function(view) {
        const d = 3.5, h = 1.2;
        switch(view) {
            case 'front': camera.position.set(1.25*d, h, 0); break;
            case 'side': camera.position.set(0, 1.25*h, d); break;
            case 'back': camera.position.set(-1.25*d, h, 0); break;
            case 'perspective': camera.position.set(d, h*1.7, d); break;
        }
        controls.update();
    };

    window.setMode = function(newMode) {
        mode = newMode;
        document.getElementById('pca-mode-btn').classList.toggle('active', mode === 'pca');
        document.getElementById('real-mode-btn').classList.toggle('active', mode === 'real');
        document.getElementById('pca-section').classList.toggle('hidden', mode !== 'pca');
        document.getElementById('real-section').classList.toggle('hidden', mode !== 'real');
        
        // Swap materials based on mode
        if (mode === 'pca') {
            markerMeshes.forEach(function(m) { m.material = pcaMotionMat; });
            meanMarkerMeshes.forEach(function(m) { m.material = averageMotionMat; });
            skeletonLines.forEach(function(s) { s.line.material = pcaMotionLineMat; });
            meanSkeletonLines.forEach(function(s) { s.line.material = averageMotionLineMat; });
        } else {
            markerMeshes.forEach(function(m) { m.material = realMotionMat; });
            meanMarkerMeshes.forEach(function(m) { m.material = reconstructionMat; });
            skeletonLines.forEach(function(s) { s.line.material = realMotionLineMat; });
            meanSkeletonLines.forEach(function(s) { s.line.material = reconstructionLineMat; });
        }
        
        frame = frameStart;
        lastFrameTime = 0;
        isPaused = false;
        updatePauseButton();
    };

    window.resetPCA = function() {
        sigmas.fill(0);
        const container = document.getElementById("pca-sliders-container");
        const sliders = container.querySelectorAll('input[type="range"]');
        const displays = container.querySelectorAll('.pc-value');
        sliders.forEach(function(s) { s.value = 0; });
        displays.forEach(function(d) { d.textContent = "0.000"; });
    };

    window.togglePause = function() {
        isPaused = !isPaused;
        updatePauseButton();
    };

    function updatePauseButton() {
        const btn = document.getElementById('pause-btn');
        if (isPaused) {
            btn.textContent = '⏸';
            btn.classList.add('paused');
        } else {
            btn.textContent = '▶';
            btn.classList.remove('paused');
        }
    }

    window.updateFPS = function() {
        fps = parseInt(document.getElementById("fps-slider").value);
        document.getElementById("fps-display").textContent = fps;
    };

    window.setFrameFromSlider = function() {
        const frameSlider = document.getElementById("frame-slider");
        frame = parseInt(frameSlider.value);
        lastFrameTime = 0;
        // Pause animation while dragging slider
        if (!frameSlider.dataset.isDragging) {
            isPaused = true;
            updatePauseButton();
        }
    };


    window.updateRange = function() {
        const rStart = parseInt(document.getElementById("range-start").value);
        const rEnd = parseInt(document.getElementById("range-end").value);
        frameStart = Math.min(rStart, rEnd);
        frameEnd = Math.max(rStart, rEnd);
        document.getElementById("range-display").textContent = frameStart + " - " + frameEnd;
    };

    window.toggleReconstruction = function() {
        showReconstruction = !showReconstruction;
        const btn = document.getElementById('reconstruction-toggle');
        if (showReconstruction) {
            btn.textContent = 'Reconstruction: ON';
            btn.style.background = '#dba86f';
            btn.style.borderColor = '#dba86f';
            btn.style.color = '#0a1419';
            btn.style.fontWeight = '700';
        } else {
            btn.textContent = 'Reconstruction: OFF';
            btn.style.background = '#465a75';
            btn.style.borderColor = '#465a75';
            btn.style.color = '#a0a0a0';
            btn.style.fontWeight = '600';
        }
    };

    window.toggleAverageMotion = function() {
        showAverageMotion = !showAverageMotion;
        const btn = document.getElementById('average-toggle');
        if (showAverageMotion) {
            btn.textContent = 'Average Motion: ON';
            btn.style.background = '#67d5ff';
            btn.style.borderColor = '#67d5ff';
            btn.style.color = '#0a1419';
            btn.style.fontWeight = '700';
        } else {
            btn.textContent = 'Average Motion: OFF';
            btn.style.background = '#465a75';
            btn.style.borderColor = '#465a75';
            btn.style.color = '#a0a0a0';
            btn.style.fontWeight = '600';
        }
    };

    window.toggleRealMotion = function() {
        showRealMotion = !showRealMotion;
        const btn = document.getElementById('real-motion-toggle');
        if (showRealMotion) {
            btn.textContent = 'Real Motion: ON';
            btn.style.background = '#67d5ff';
            btn.style.borderColor = '#67d5ff';
            btn.style.color = '#0a1419';
            btn.style.fontWeight = '700';
        } else {
            btn.textContent = 'Real Motion: OFF';
            btn.style.background = '#465a75';
            btn.style.borderColor = '#465a75';
            btn.style.color = '#a0a0a0';
            btn.style.fontWeight = '600';
        }
    };

    window.updatePitchFilters = function() {
        if (!REAL_DATA) return;
        
        const selectedUser = document.getElementById('user-select').value;
        const filteredPitches = REAL_DATA.filter(function(pitch) {
            const pitchUser = pitch.id.split('_')[0];
            return !selectedUser || pitchUser === selectedUser;
        });

        const pitchSelect = document.getElementById('pitch-select');
        pitchSelect.innerHTML = '<option value="">Select a pitch</option>';
        filteredPitches.forEach(function(pitch) {
            const opt = document.createElement('option');
            opt.value = pitch.id;
            const labelMatch = pitch.label.match(/@\s*([\d.]+)mph/);
            const vel = labelMatch ? parseFloat(labelMatch[1]) : 0;
            const parts = pitch.label.split(' @ ');
            const newLabel = parts[0] + ' @ ' + vel.toFixed(1) + 'mph)';
            opt.textContent = newLabel;
            pitchSelect.appendChild(opt);
        });
    };

    window.onPitchSelect = function() {
        const pitchId = document.getElementById('pitch-select').value;
        if (!pitchId || !REAL_DATA) return;
        
        currentRealPitch = REAL_DATA.find(function(p) { return p.id === pitchId; });
        if (currentRealPitch) {
            frameStart = 0;
            frameEnd = currentRealPitch.max_frames - 1;
            frame = frameStart;
            lastFrameTime = 0;
            isPaused = false;
            updatePauseButton();
            
            const rStart = document.getElementById("range-start");
            const rEnd = document.getElementById("range-end");
            const frameSlider = document.getElementById("frame-slider");
            rStart.max = rEnd.max = frameEnd;
            frameSlider.max = frameEnd;
            rStart.value = frameStart;
            rEnd.value = frameEnd;
            frameSlider.value = frameStart;
            document.getElementById("range-display").textContent = frameStart + " - " + frameEnd;

            if (PCA_SCORES) {
                let pcaScoreEntry = PCA_SCORES.find(function(entry) { return entry.id === pitchId; });
                if (!pcaScoreEntry) {
                    const parts = pitchId.split('_');
                    const paddedId = parts[0] + '_' + parts[1] + '_' + parts[2].padStart(3, '0');
                    pcaScoreEntry = PCA_SCORES.find(function(entry) { return entry.id === paddedId; });
                }
                if (pcaScoreEntry) displayPCWeights(pcaScoreEntry.pc_scores);
            }
        }
    };

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(3, 10, 5);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(10, 20, 0xffffff, 0x555555);
    grid.material.transparent = true;
    grid.material.opacity = 0.25;
    scene.add(grid);

    const connections = [["LBHD","LFHD"],["RBHD","RFHD"],["LFHD","RFHD"],["LBHD","RBHD"],["C7","STRN"],["C7","CLAV"],["STRN","CLAV"],["CLAV","LSHO"],["CLAV","RSHO"],["LSHO","RSHO"],["LSHO","LASI"],["RSHO","RASI"],["LASI","RASI"],["LPSI","RPSI"],["LASI","LPSI"],["RASI","RPSI"],["LSHO","LUPA"],["LUPA","LELB"],["LELB","LFRM"],["LFRM","LWRA"],["LWRA","LWRB"],["LWRB","LFIN"],["RSHO","RUPA"],["RUPA","RELB"],["RELB","RFRM"],["RFRM","RWRA"],["RWRA","RWRB"],["RWRB","RFIN"],["LASI","LTHI"],["LTHI","LKNE"],["LKNE","LTIB"],["LTIB","LANK"],["LANK","LHEE"],["LANK","LTOE"],["LHEE","LTOE"],["LANK","LMANK"],["RASI","RTHI"],["RTHI","RKNE"],["RKNE","RTIB"],["RTIB","RANK"],["RANK","RHEE"],["RANK","RTOE"],["RHEE","RTOE"],["RANK","RMANK"]];

    async function initPCA() {
        try {
            const res = await fetch("data/pca_data.json");
            PCA = await res.json();
        } catch (e) {
            console.error("Error loading pca_data.json", e);
            return false;
        }

        const { X_mean, V, Lambda, marker_labels, feature_names, n_frames } = PCA;
        sigmas = new Array(Lambda.length).fill(0);
        modelGroup.rotation.x = -Math.PI / 2;

        const pcaContainer = document.getElementById("pca-sliders-container");
        sigmas.forEach(function(_, i) {
            const group = document.createElement("div");
            group.className = "pca-slider-group";
            
            const label = document.createElement("div");
            label.className = "pc-label";
            label.textContent = "PC" + (i + 1);
            group.appendChild(label);
            
            const wrapper = document.createElement("div");
            wrapper.className = "slider-wrapper";
            
            const slider = document.createElement('input');
            slider.type = 'range';
            slider.className = 'pca-slider';
            slider.min = '-4';
            slider.max = '4';
            slider.step = '0.001';
            slider.value = '0';
            
            const display = document.createElement('div');
            display.className = 'pc-value';
            display.textContent = '0.000';
            
            slider.oninput = function(e) {
                sigmas[i] = parseFloat(e.target.value);
                display.textContent = sigmas[i].toFixed(3);
            };
            
            wrapper.appendChild(slider);
            wrapper.appendChild(display);
            group.appendChild(wrapper);
            pcaContainer.appendChild(group);
        });

        const markerIndex = {};
        marker_labels.forEach(function(m, i) { markerIndex[m] = i; });

        featureMap = feature_names.map(function(name) {
            const p = name.split("_");
            return { axis: p[0], frame: parseInt(p[2]), markerIndex: markerIndex[p[1]] };
        });

        meanMotion = X_mean.slice();
        return { marker_labels, n_frames };
    }

    async function initReal() {
        try {
            const res = await fetch("data/real_data.json");
            const text = await res.text();
            const cleanedText = text.replace(/:\s*NaN/g, ': null');
            REAL_DATA = JSON.parse(cleanedText);
        } catch (e) {
            console.error("Error loading real_data.json", e);
            return false;
        }

        try {
            const mapRes = await fetch("data/pitch_marker_mapping.json");
            MARKER_MAPPING = await mapRes.json();
        } catch (e) {
            console.error("Error loading pitch_marker_mapping.json", e);
        }

        REAL_DATA.forEach(function(pitch) {
            const cleanFrames = {};
            Object.entries(pitch.frames).forEach(function([frameIdx, frameData]) {
                const cleanedFrame = {};
                Object.entries(frameData).forEach(function([marker, coords]) {
                    if (coords.x !== null && coords.y !== null && coords.z !== null &&
                        !isNaN(coords.x) && !isNaN(coords.y) && !isNaN(coords.z)) {
                        cleanedFrame[marker] = coords;
                    }
                });
                if (Object.keys(cleanedFrame).length > 0) {
                    cleanFrames[frameIdx] = cleanedFrame;
                }
            });
            pitch.frames = cleanFrames;
            pitch.max_frames = Math.max.apply(null, Object.keys(pitch.frames).map(Number)) + 1;
        });

        const userSelect = document.getElementById('user-select');
        const users = new Set();
        REAL_DATA.forEach(function(pitch) {
            users.add(pitch.id.split('_')[0]);
        });
        Array.from(users).sort().forEach(function(user) {
            const opt = document.createElement('option');
            opt.value = user;
            opt.textContent = "User " + user;
            userSelect.appendChild(opt);
        });

        if (REAL_DATA.length > 0) {
            const firstPitch = REAL_DATA[0];
            const allMarkers = new Set();
            Object.values(firstPitch.frames).forEach(function(frameData) {
                Object.keys(frameData).forEach(function(m) { allMarkers.add(m); });
            });
            return Array.from(allMarkers);
        }
        return [];
    }

    async function loadPCAScores() {
        try {
            const res = await fetch("data/pca_scores.json");
            PCA_SCORES = await res.json();
        } catch (e) {
            console.error("Error loading pca_scores.json", e);
            PCA_SCORES = null;
        }
    }

    async function init() {
        const sphereGeo = new THREE.SphereGeometry(0.018, 24, 24);
        
        // PCA Tab materials
        pcaMotionMat = new THREE.MeshStandardMaterial({ color: 0xdba86f, emissive: 0xdba86f, emissiveIntensity: 0.5 });
        averageMotionMat = new THREE.MeshStandardMaterial({ color: 0x67d5ff, emissive: 0x67d5ff, emissiveIntensity: 0.5 });
        
        // Real Tab materials
        realMotionMat = new THREE.MeshStandardMaterial({ color: 0x67d5ff, emissive: 0x67d5ff, emissiveIntensity: 0.5 });
        reconstructionMat = new THREE.MeshStandardMaterial({ color: 0xdba86f, emissive: 0xdba86f, emissiveIntensity: 0.5 });
        
        // Use PCA materials by default
        const sphereMat = pcaMotionMat;
        const meanSphereMat = averageMotionMat;

        const pcaResult = await initPCA();
        const realMarkers = await initReal();
        await loadPCAScores();

        if (!pcaResult && !realMarkers.length) {
            document.getElementById('loading').textContent = "Error loading data files";
            return;
        }

        if (REAL_DATA) {
            REAL_DATA.forEach(function(pitch) {
                if (MARKER_MAPPING && MARKER_MAPPING[pitch.id]) {
                    pitch.markerOrder = MARKER_MAPPING[pitch.id];
                } else {
                    const firstFrameData = Object.values(pitch.frames)[0] || {};
                    pitch.markerOrder = Object.keys(firstFrameData);
                }
            });
        }

        let allMarkerLabels;
        if (pcaResult) {
            allMarkerLabels = pcaResult.marker_labels;
        } else if (REAL_DATA && REAL_DATA.length > 0) {
            const allMarkers = new Set();
            REAL_DATA.forEach(function(pitch) {
                pitch.markerOrder.forEach(function(m) { allMarkers.add(m); });
            });
            allMarkerLabels = Array.from(allMarkers);
        } else {
            allMarkerLabels = [];
        }

        allMarkerLabels.forEach(function(label) {
            const m = new THREE.Mesh(sphereGeo, sphereMat);
            m.userData.label = label;
            modelGroup.add(m);
            markerMeshes.push(m);
        });

        allMarkerLabels.forEach(function(label) {
            const m = new THREE.Mesh(sphereGeo, meanSphereMat);
            m.userData.label = label;
            modelGroup.add(m);
            meanMarkerMeshes.push(m);
        });

        const markerIndex = {};
        allMarkerLabels.forEach(function(label, idx) {
            markerIndex[label] = idx;
        });

        pcaMotionLineMat = new THREE.LineBasicMaterial({ color: 0xdba86f, opacity: 0.8, transparent: true });
        averageMotionLineMat = new THREE.LineBasicMaterial({ color: 0x67d5ff, opacity: 0.8, transparent: true });
        realMotionLineMat = new THREE.LineBasicMaterial({ color: 0x67d5ff, opacity: 0.8, transparent: true });
        reconstructionLineMat = new THREE.LineBasicMaterial({ color: 0xdba86f, opacity: 0.8, transparent: true });
        
        // Use PCA line materials by default
        const lineMat = pcaMotionLineMat;
        const meanLineMat = averageMotionLineMat;
        
        connections.forEach(function([a, b]) {
            const ia = markerIndex[a];
            const ib = markerIndex[b];
            if (ia !== undefined && ib !== undefined) {
                const g = new THREE.BufferGeometry();
                g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(6), 3));
                const l = new THREE.Line(g, lineMat);
                modelGroup.add(l);
                skeletonLines.push({ line: l, i: ia, j: ib });

                const mg = new THREE.BufferGeometry();
                mg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(6), 3));
                const ml = new THREE.Line(mg, meanLineMat);
                modelGroup.add(ml);
                meanSkeletonLines.push({ line: ml, i: ia, j: ib });
            }
        });

        const rStart = document.getElementById("range-start");
        const rEnd = document.getElementById("range-end");
        const frameSlider = document.getElementById("frame-slider");
        const n_frames = pcaResult ? pcaResult.n_frames : 100;
        rStart.max = rEnd.max = n_frames - 1;
        frameSlider.max = n_frames - 1;
        rEnd.value = n_frames - 1;
        frameEnd = n_frames - 1;
        updateRange();

        document.getElementById('loading').style.display = 'none';
        
        // Add frame slider event listeners
        frameSlider.addEventListener('mousedown', function() {
            this.dataset.isDragging = 'true';
            isPaused = true;
            updatePauseButton();
        });
        frameSlider.addEventListener('mouseup', function() {
            delete this.dataset.isDragging;
        });
        frameSlider.addEventListener('touchstart', function() {
            this.dataset.isDragging = 'true';
            isPaused = true;
            updatePauseButton();
        });
        frameSlider.addEventListener('touchend', function() {
            delete this.dataset.isDragging;
        });
        
        animate(0);
    }

    function reconstructPCA(frameIdx) {
        const { X_mean, V, Lambda } = PCA;
        const currentX = new Array(X_mean.length);
        for (let i = 0; i < X_mean.length; i++) {
            let val = X_mean[i];
            for (let k = 0; k < sigmas.length; k++) {
                val += sigmas[k] * Math.sqrt(Lambda[k]) * V[i][k];
            }
            currentX[i] = val;
        }
        featureMap.forEach(function(feat, fIdx) {
            if (feat.frame === frameIdx) {
                const m = markerMeshes[feat.markerIndex];
                if (m) m.position[feat.axis] = currentX[fIdx];
            }
        });
        skeletonLines.forEach(function(s) {
            const pos = s.line.geometry.attributes.position.array;
            const a = markerMeshes[s.i].position, b = markerMeshes[s.j].position;
            pos[0] = a.x; pos[1] = a.y; pos[2] = a.z;
            pos[3] = b.x; pos[4] = b.y; pos[5] = b.z;
            s.line.geometry.attributes.position.needsUpdate = true;
        });
    }

    function reconstructMean(frameIdx) {
        if (!meanMotion || !showAverageMotion) {
            meanMarkerMeshes.forEach(function(m) { m.visible = false; });
            meanSkeletonLines.forEach(function(s) { s.line.visible = false; });
            return;
        }
        featureMap.forEach(function(feat, fIdx) {
            if (feat.frame === frameIdx) {
                const m = meanMarkerMeshes[feat.markerIndex];
                if (m) {
                    m.position[feat.axis] = meanMotion[fIdx];
                    m.visible = true;
                }
            }
        });
        meanSkeletonLines.forEach(function(s) {
            const pos = s.line.geometry.attributes.position.array;
            const a = meanMarkerMeshes[s.i].position, b = meanMarkerMeshes[s.j].position;
            pos[0] = a.x; pos[1] = a.y; pos[2] = a.z;
            pos[3] = b.x; pos[4] = b.y; pos[5] = b.z;
            s.line.geometry.attributes.position.needsUpdate = true;
            s.line.visible = a.visible && b.visible;
        });
    }

    function reconstructReal(frameIdx) {
        if (!currentRealPitch || currentRealPitch.frames[frameIdx] === undefined) return;
        const frameData = currentRealPitch.frames[frameIdx];
        
        if (!showRealMotion) {
            markerMeshes.forEach(function(m) { m.visible = false; });
            skeletonLines.forEach(function(s) { s.line.visible = false; });
        } else {
            markerMeshes.forEach(function(m) {
                m.position.set(0, 0, 0);
                m.visible = false;
            });
            Object.entries(frameData).forEach(function([markerLabel, pos]) {
                for (let i = 0; i < markerMeshes.length; i++) {
                    if (markerMeshes[i].userData.label === markerLabel) {
                        markerMeshes[i].position.set(pos.x, pos.y, pos.z);
                        markerMeshes[i].visible = true;
                        break;
                    }
                }
            });
            skeletonLines.forEach(function(s) {
                const a = markerMeshes[s.i];
                const b = markerMeshes[s.j];
                if (a.visible && b.visible) {
                    const pos = s.line.geometry.attributes.position.array;
                    pos[0] = a.position.x; pos[1] = a.position.y; pos[2] = a.position.z;
                    pos[3] = b.position.x; pos[4] = b.position.y; pos[5] = b.position.z;
                    s.line.geometry.attributes.position.needsUpdate = true;
                    s.line.visible = true;
                } else {
                    s.line.visible = false;
                }
            });
        }

        if (showReconstruction && PCA_SCORES && PCA && currentRealPitch) {
            let pcaScoreEntry = PCA_SCORES.find(function(entry) { return entry.id === currentRealPitch.id; });
            if (!pcaScoreEntry && currentRealPitch.id) {
                const parts = currentRealPitch.id.split('_');
                const paddedId = parts[0] + '_' + parts[1] + '_' + parts[2].padStart(3, '0');
                pcaScoreEntry = PCA_SCORES.find(function(entry) { return entry.id === paddedId; });
            }

            if (pcaScoreEntry) {
                const { X_mean, V, Lambda } = PCA;
                const pc_scores = pcaScoreEntry.pc_scores;
                const currentX = new Array(X_mean.length);
                
                meanMarkerMeshes.forEach(function(m) { m.visible = false; });
                
                for (let i = 0; i < X_mean.length; i++) {
                    let val = X_mean[i];
                    for (let k = 0; k < pc_scores.length; k++) {
                        val += pc_scores[k] * Math.sqrt(Lambda[k]) * V[i][k];
                    }
                    currentX[i] = val;
                }

                featureMap.forEach(function(feat, fIdx) {
                    if (feat.frame === frameIdx) {
                        const m = meanMarkerMeshes[feat.markerIndex];
                        if (m) {
                            m.position[feat.axis] = currentX[fIdx];
                            m.visible = true;
                        }
                    }
                });

                meanSkeletonLines.forEach(function(s) {
                    const pos = s.line.geometry.attributes.position.array;
                    const a = meanMarkerMeshes[s.i].position, b = meanMarkerMeshes[s.j].position;
                    pos[0] = a.x; pos[1] = a.y; pos[2] = a.z;
                    pos[3] = b.x; pos[4] = b.y; pos[5] = b.z;
                    s.line.geometry.attributes.position.needsUpdate = true;
                    s.line.visible = a.visible && b.visible;
                });

                displayPCWeights(pc_scores);
            }
        } else {
            meanMarkerMeshes.forEach(function(m) { m.visible = false; });
            meanSkeletonLines.forEach(function(s) { s.line.visible = false; });
        }
    }

    function displayPCWeights(pc_scores) {
        const pcWeightsDiv = document.getElementById('pc-weights-display');
        if (!pcWeightsDiv) return;

        let html = '<div style="font-size: 8px; color: #8a9bab; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.3px;">PC Weights:</div>';
        pc_scores.forEach(function(score, idx) {
            const color = score > 0.1 ? '#7dd157' : score < -0.1 ? '#ff7675' : '#a0a0a0';
            html += '<div class="pc-weight-item"><span>PC' + (idx+1) + '</span><span style="color: ' + color + ';">' + score.toFixed(3) + '</span></div>';
        });
        pcWeightsDiv.innerHTML = html;
    }

    function animate(time) {
        requestAnimationFrame(animate);
        if (time - lastFrameTime > (1000 / fps)) {
            const frameToShow = Math.min(frame, mode === 'pca' ? PCA.n_frames - 1 : (currentRealPitch ? currentRealPitch.max_frames - 1 : 0));
            document.getElementById('frame-counter').textContent = frameToShow;
            document.getElementById('frame-slider').value = frameToShow;

            if (mode === 'pca') {
                reconstructMean(frameToShow);
                reconstructPCA(frameToShow);
            } else {
                reconstructReal(frameToShow);
            }

            if (!isPaused) {
                frame = (frame >= frameEnd) ? frameStart : frame + 1;
            }
            
            lastFrameTime = time;
        }
        controls.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', function() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
</script>
</body>
</html>
